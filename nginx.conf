# Nginx configuration for mehanoid.space / nl.mehanoid.space
# Front-facing camouflage website + secret VPN reverse-proxy

server {
    listen 80;
    listen [::]:80;
    server_name mehanoid.space *.mehanoid.space;

    # ACME challenge for cert renewal
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name mehanoid.space nl.mehanoid.space;

    ssl_certificate /etc/letsencrypt/live/mehanoid.space/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mehanoid.space/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # Security headers
    add_header X-Content-Type-Options nosniff;
    add_header X-Frame-Options SAMEORIGIN;
    add_header X-XSS-Protection "1; mode=block";
    add_header Referrer-Policy "strict-origin-when-cross-origin";

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1000;

    # Static Camouflage Website
    root /var/www/mehanoid-space;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(css|js|svg|png|jpg|ico|woff2)$ {
        expires 7d;
        add_header Cache-Control "public, no-transform";
    }

    # Secret VPN endpoint: forward to Xray backend (e.g. listening on 127.0.0.1:8443)
    location /nl-stream {
        proxy_redirect off;
        proxy_pass http://127.0.0.1:8443;
        
        # HTTP/2 & WebSocket support
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # Disable buffering for low-latency streaming
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
